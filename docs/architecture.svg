<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <style>
    .box { fill:#f8fafc; stroke:#0f172a; stroke-width:1.5 } 
    .title { font: bold 18px/1.2 sans-serif; fill:#0f172a }
    .label { font: 14px/1.2 sans-serif; fill:#0f172a }
    .small { font: 12px/1.2 sans-serif; fill:#0f172a }
    .arrow { stroke:#0f172a; stroke-width:2; fill:none; marker-end:url(#arrowhead) }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Browser -->
  <g transform="translate(40,40)">
    <rect class="box" x="0" y="0" width="220" height="70" rx="8" />
    <text class="title" x="16" y="28">Browser</text>
    <text class="small" x="16" y="48">User agent (client)</text>
  </g>

  <!-- Next.js App (Server + Client) -->
  <g transform="translate(320,20)">
    <rect class="box" x="0" y="0" width="520" height="220" rx="10" />
    <text class="title" x="16" y="28">Next.js App</text>
    <text class="small" x="16" y="48">Server + Client</text>

    <!-- UI box -->
    <rect class="box" x="16" y="64" width="230" height="56" rx="6" />
    <text class="label" x="28" y="96">UI: app/* (pages & components)</text>

    <!-- Image resolver -->
    <rect class="box" x="270" y="64" width="230" height="56" rx="6" />
    <text class="label" x="282" y="96">Image resolver: lib/image.ts</text>

    <!-- Presign API -->
    <rect class="box" x="16" y="134" width="230" height="56" rx="6" />
    <text class="label" x="28" y="166">Presign API: app/api/r2/route.ts</text>

    <!-- R2 helper -->
    <rect class="box" x="270" y="134" width="230" height="56" rx="6" />
    <text class="label" x="282" y="166">R2 helper: lib/r2.ts</text>
  </g>

  <!-- Storage -->
  <g transform="translate(320,260)">
    <rect class="box" x="0" y="0" width="240" height="120" rx="8" />
    <text class="title" x="16" y="28">Storage</text>
    <text class="small" x="16" y="52">Local: public/images/* (dev, fallback)</text>
    <text class="small" x="16" y="72">Cloudflare R2: images (private)</text>
  </g>

  <!-- Data / DB / CMS -->
  <g transform="translate(620,260)">
    <rect class="box" x="0" y="0" width="220" height="120" rx="8" />
    <text class="title" x="16" y="28">Data / DB / CMS</text>
    <text class="small" x="16" y="52">Local metadata: data/*</text>
    <text class="small" x="16" y="72">Optional: Sanity / Prisma / DB</text>
    <text class="small" x="16" y="92">Contact messages: lib/db.ts</text>
  </g>

  <!-- Scripts -->
  <g transform="translate(920,40)">
    <rect class="box" x="0" y="0" width="220" height="80" rx="8" />
    <text class="title" x="16" y="28">Scripts</text>
    <text class="small" x="16" y="52">scripts/* (list-r2, check-images)</text>
  </g>

  <!-- Arrows: Browser -> Next.js App -->
  <path class="arrow" d="M260 75 L320 75" />
  <text class="small" x="290" y="64">HTTP(S) requests</text>

  <!-- Next.js App -> Presign API -> R2 -->
  <path class="arrow" d="M540 200 L540 260 L380 260" />
  <text class="small" x="476" y="200">/api/r2 (presign)</text>

  <path class="arrow" d="M435 260 L435 320 L400 320" />

  <!-- Next.js App -> Storage (public images) -->
  <path class="arrow" d="M430 220 L430 260" />
  <text class="small" x="360" y="242">serve public images</text>

  <!-- Presigned redirect to R2 (browser follows) -->
  <path class="arrow" d="M480 320 L600 320" />
  <text class="small" x="522" y="310">302 redirect to presigned R2 URL</text>

  <!-- R2 arrow -->
  <path class="arrow" d="M700 320 L840 320" />

  <!-- Labels linking sections -->
  <text class="small" x="940" y="140">Useful files: app/, lib/, scripts/</text>

  <!-- Footer note -->
  <text class="small" x="40" y="640">Diagram: Browser → Next.js → (public images or presigned Cloudflare R2)</text>

</svg>
